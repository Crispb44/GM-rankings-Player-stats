<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynasty GM Power Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101216;
    --panel:#1a1d24;
    --panel-2:#20242c;
    --line:#2c313b;
    --amber:#ffb020;
    --amber-dim:#8a6420;
    --wood:#c4956c;
    --text:#eeeae2;
    --text-dim:#9a9fac;
    --text-faint:#5b6070;
    --pos:#5fd68a;
    --neg:#e2626b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#14171d 0%, #101216 100%);
    border-bottom:1px solid var(--line);
    padding:14px 16px 0 16px;
  }
  .title-row{display:flex; align-items:baseline; gap:10px; margin-bottom:12px;}
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
    text-transform:uppercase;
  }
  .tabs{ display:flex; gap:4px; }
  .tab{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    padding:9px 14px 10px 14px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tab.active{ color:var(--amber); border-bottom-color:var(--amber); }
  .hint{
    padding:7px 16px;
    font-size:11px;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .table-wrap{
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    max-height:calc(100vh - 118px);
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  thead th{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--panel-2);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    text-align:left;
    padding:9px 10px;
    border-bottom:2px solid var(--line);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
  }
  thead th:hover{ color:var(--amber); }
  thead th.sorted{ color:var(--amber); background:#262b35; }
  thead th .arrow{ margin-left:4px; opacity:0.7; font-size:9px; }
  thead th .calc-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--wood);
    margin-left:5px;
    vertical-align:middle;
    opacity:0.8;
  }
  thead th:first-child, tbody td:first-child{
    position:sticky; left:0; z-index:5;
    background:var(--panel-2);
    box-shadow: 3px 0 6px -2px rgba(0,0,0,0.55);
  }
  tbody td:first-child{ background:var(--panel); font-family:'Inter',sans-serif; font-weight:500; }
  tbody tr:nth-child(even) td:first-child{ background:#171a20; }
  tbody td{
    padding:7px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    color:var(--text);
  }
  tbody tr:nth-child(even) td{ background:#171a20; }
  tbody tr:hover td{ background:#252a34; }
  tbody tr:hover td:first-child{ background:#252a34; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  td.prose{ font-family:'Inter',sans-serif; white-space:normal; max-width:320px; line-height:1.4; }
  td.pos{ color:var(--pos); }
  td.neg{ color:var(--neg); }
  .empty{ color:var(--text-faint); }
  .legend{
    padding:12px 16px 20px 16px;
    background:var(--panel);
    border-top:1px solid var(--line);
    font-family:'Inter',sans-serif;
  }
  .legend-title{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .legend-item{
    font-size:11.5px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .legend-item b{ color:var(--wood); font-weight:600; }
  .legend-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--wood);
    margin-right:6px;
    vertical-align:middle;
    opacity:0.8;
  }
  .readme{
    padding:18px 16px 40px 16px;
    max-width:640px;
  }
  .readme-hero{ margin-bottom:22px; }
  .readme-hero h2{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    color:var(--amber);
    margin:0 0 4px 0;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .readme-hero p{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    margin:0;
  }
  .rm-section{ margin-bottom:22px; }
  .rm-section-title{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--wood);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .rm-item{
    font-size:13px;
    line-height:1.55;
    color:var(--text);
    margin-bottom:7px;
    padding-left:14px;
    position:relative;
  }
  .rm-item::before{
    content:'\2013';
    position:absolute;
    left:0;
    color:var(--amber-dim);
  }
</style>
</head>

let state = { tab: 'teamSummary', sortCol: null, sortDir: 1 };

function isNumericCol(rows, colIdx){
  let sawNumber = false;
  for(const row of rows){
    const v = row[colIdx];
    if(v === null || v === undefined || v === '') continue;
    if(typeof v === 'number'){ sawNumber = true; }
    else return false;
  }
  return sawNumber;
}

function fmtNum(v){
  if(v === null || v === undefined || v === '') return '';
  if(Number.isInteger(v)) return v.toString();
  return v.toFixed(2);
}

function renderTable(){
  const d = DATA[state.tab];
  const headers = d.headers;
  const calcSet = new Set(d.calcCols || []);
  let rows = d.rows.slice();

  const numericCols = headers.map((_, i) => isNumericCol(d.rows, i));

  if(state.sortCol !== null){
    const idx = state.sortCol;
    const numeric = numericCols[idx];
    rows.sort((a, b) => {
      let av = a[idx], bv = b[idx];
      const aEmpty = (av === null || av === undefined || av === '');
      const bEmpty = (bv === null || bv === undefined || bv === '');
      if(aEmpty && bEmpty) return 0;
      if(aEmpty) return 1;
      if(bEmpty) return -1;
      if(numeric) return (av - bv) * state.sortDir;
      return String(av).localeCompare(String(bv)) * state.sortDir;
    });
  }

  let html = '<table><thead><tr>';
  headers.forEach((h, i) => {
    const sorted = state.sortCol === i;
    const arrow = sorted ? (state.sortDir === 1 ? '\u25B2' : '\u25BC') : '';
    const dot = calcSet.has(h) ? '<span class="calc-dot"></span>' : '';
    html += `<th class="${sorted ? 'sorted' : ''}" data-col="${i}">${h}${dot}${arrow ? ` <span class="arrow">${arrow}</span>` : ''}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(row => {
    html += '<tr>';
    row.forEach((v, i) => {
      const numeric = numericCols[i];
      const isProse = headers[i] === 'Archetype Description' || headers[i] === 'Manager Archetype';
      let cls = '';
      let display = v;
      if(v === null || v === undefined || v === ''){
        display = ''; cls = 'empty';
      } else if(numeric){
        cls = 'num';
        if(v > 0.001) cls += ' pos';
        else if(v < -0.001) cls += ' neg';
        display = fmtNum(v);
      } else if(isProse){
        cls = 'prose';
      }
      html += `<td class="${cls}">${display}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;

  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const col = parseInt(th.dataset.col);
      if(state.sortCol === col){ state.sortDir *= -1; }
      else { state.sortCol = col; state.sortDir = -1; }
      renderTable();
    });
  });

  renderLegend(d);
}

function renderLegend(d){
  const notes = d.notes || [];
  const hasCalc = (d.calcCols || []).length > 0;
  if(notes.length === 0 && !hasCalc){
    document.getElementById('legend').innerHTML = '';
    return;
  }
  let html = '<div class="legend-title">Column Notes</div>';
  notes.forEach(n => {
    html += `<div class="legend-item"><b>${n.label}:</b> ${n.note}</div>`;
  });
  if(hasCalc){
    html += `<div class="legend-item"><span class="legend-dot"></span>auto-calculated, not a manual input</div>`;
  }
  document.getElementById('legend').innerHTML = html;
}

function renderReadme(){
  const rm = DATA.readme;
  let html = `<div class="readme"><div class="readme-hero"><h2>${rm.title}</h2><p>${rm.subtitle}</p></div>`;
  rm.sections.forEach(s => {
    html += '<div class="rm-section">';
    if(s.title) html += `<div class="rm-section-title">${s.title}</div>`;
    s.items.forEach(it => {
      html += `<div class="rm-item">${it}</div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('tableWrap').innerHTML = html;
  document.getElementById('legend').innerHTML = '';
}

function render(){
  const hint = document.getElementById('hint');
  if(state.tab === 'readme'){
    hint.style.display = 'none';
    renderReadme();
  } else {
    hint.style.display = 'block';
    renderTable();
  }
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    state.sortCol = null;
    state.sortDir = 1;
    render();
  });
});

render();
