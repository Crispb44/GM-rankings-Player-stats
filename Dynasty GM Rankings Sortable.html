<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynasty GM Power Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101216;
    --panel:#1a1d24;
    --panel-2:#20242c;
    --line:#2c313b;
    --amber:#ffb020;
    --amber-dim:#8a6420;
    --wood:#c4956c;
    --text:#eeeae2;
    --text-dim:#9a9fac;
    --text-faint:#5b6070;
    --pos:#5fd68a;
    --neg:#e2626b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#14171d 0%, #101216 100%);
    border-bottom:1px solid var(--line);
    padding:14px 16px 0 16px;
  }
  .title-row{display:flex; align-items:baseline; gap:10px; margin-bottom:12px;}
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
    text-transform:uppercase;
  }
  .tabs{ display:flex; gap:4px; }
  .tab{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    padding:9px 14px 10px 14px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tab.active{ color:var(--amber); border-bottom-color:var(--amber); }
  .season-toggle{ display:flex; gap:6px; padding:8px 0 10px 0; }
  .season-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:500;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:5px 12px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .season-btn.active{ color:var(--bg); background:var(--wood); border-color:var(--wood); font-weight:600; }
  .hint{
    padding:7px 16px;
    font-size:11px;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .table-wrap{
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    max-height:calc(100vh - 118px);
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  thead th{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--panel-2);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    text-align:left;
    padding:9px 10px;
    border-bottom:2px solid var(--line);
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
  }
  thead th:hover{ color:var(--amber); }
  thead th.sorted{ color:var(--amber); background:#262b35; }
  thead th .arrow{ margin-left:4px; opacity:0.7; font-size:9px; }
  thead th .calc-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--wood);
    margin-left:5px;
    vertical-align:middle;
    opacity:0.8;
  }
  thead th:first-child, tbody td:first-child{
    position:sticky; left:0; z-index:5;
    background:var(--panel-2);
    box-shadow: 3px 0 6px -2px rgba(0,0,0,0.55);
  }
  tbody td:first-child{ background:var(--panel); font-family:'Inter',sans-serif; font-weight:500; }
  tbody tr:nth-child(even) td:first-child{ background:#171a20; }
  tbody td{
    padding:7px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    color:var(--text);
  }
  tbody tr:nth-child(even) td{ background:#171a20; }
  tbody tr:hover td{ background:#252a34; }
  tbody tr:hover td:first-child{ background:#252a34; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  td.prose{ font-family:'Inter',sans-serif; white-space:normal; max-width:320px; line-height:1.4; }
  td.pos{ color:var(--pos); }
  td.neg{ color:var(--neg); }
  .empty{ color:var(--text-faint); }
  .legend{
    padding:12px 16px 20px 16px;
    background:var(--panel);
    border-top:1px solid var(--line);
    font-family:'Inter',sans-serif;
  }
  .legend-title{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .legend-item{
    font-size:11.5px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .legend-item b{ color:var(--wood); font-weight:600; }
  .legend-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--wood);
    margin-right:6px;
    vertical-align:middle;
    opacity:0.8;
  }
  .readme{
    padding:18px 16px 40px 16px;
    max-width:640px;
  }
  .readme-hero{ margin-bottom:22px; }
  .readme-hero h2{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    color:var(--amber);
    margin:0 0 4px 0;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .readme-hero p{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    margin:0;
  }
  .rm-section{ margin-bottom:22px; }
  .rm-section-title{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--wood);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .rm-item{
    font-size:13px;
    line-height:1.55;
    color:var(--text);
    margin-bottom:7px;
    padding-left:14px;
    position:relative;
  }
  .rm-item::before{
    content:'\2013';
    position:absolute;
    left:0;
    color:var(--amber-dim);
  }
  .rm-tree{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    line-height:1.65;
    color:var(--text-dim);
    white-space:pre-wrap;
    margin-bottom:2px;
  }
  .rm-tree.gen{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--amber);
    white-space:normal;
    margin-top:16px;
    margin-bottom:4px;
  }
  .rm-tree.sub{
    color:var(--wood);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    white-space:normal;
    margin-bottom:8px;
  }
  .col-tooltip{
    position:fixed;
    z-index:999;
    max-width:280px;
    background:var(--panel-2, #1b2029);
    border:1px solid var(--wood);
    border-radius:10px;
    padding:12px 14px;
    font-size:12.5px;
    line-height:1.5;
    color:var(--text);
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    display:none;
  }
  .col-tooltip .tt-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    color:var(--wood);
    text-transform:uppercase;
    font-size:12.5px;
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  th.pressed{ background:var(--panel-2, #1b2029); }
</style>
</head>

ed score for true rookies (see rubric below)", "established-player formula: league percentile + steep age curve + minutes-trust dampening", "|", "GENERATION 2 - BLENDING THE SEASONS", "|-- Multi-Year Blended Score    <- Fantasy Score + Prior Season FS", "|     65/35 current-weighted split - flips to 35/65 if under 25 GP this season", "'-- Minutes Trust Weight        <- MPG  =  MIN(1, MAX(0.4, MPG/30))", "|", "GENERATION 3 - THREE WAYS TO READ A SEASON", "|-- Per-36 Fantasy Score        <- Multi-Year Blended + MPG (minutes-normalized)", "|-- Per-100-Poss Fantasy Score  <- Multi-Year Blended + MPG + Team Pace (pace-normalized)", "'-- Rookie/Sophomore Trust Wt   <- GP + rookie status (Yr1: 0.5->1.0, Yr2: 0.75->1.0, Yr3+: 1.0)", "|", "GENERATION 4 - BLENDED PRODUCTION", "Blended Production  <- Multi-Year + Per-36 + Per-100 + Minutes Trust Weight", "MinutesTrust x AVG(3 reads) + (1-MinutesTrust) x MultiYear", "|", "GENERATION 5 - ADJUSTED PRODUCTION", "Adjusted Production  <- Blended Production + Rookie/Sophomore Trust Weight", "TrustWeight x BlendedProduction + (1-TrustWeight) x LeagueAvg", "|", "GENERATION 6 - TRADABLE ASSET GRADE", "Tradable Asset Grade  <- Adjusted Production x Age Mult x Injury Mult x Draft Pedigree Mult", "AdjProd x [(AgeMult + InjuryMult)/2] x DraftPedigreeMult", "If zero games played: Rookie Opportunity Score + Rookie Age Penalty step in instead,", "so a true rookie doesn't default to the literal worst asset in the league", "|", "GENERATION 7 - STANDING THEM UP AGAINST THE LEAGUE", "|-- Tradable Asset Z-Score      <- Tradable Asset Grade, standardized vs all 182 rostered players", "'-- Future Outlook Z-Score      <- Future Outlook, standardized vs all 182 rostered players", "|", "GENERATION 8 - THE MARRIAGE", "COMPOSITE SCORE  =  55% Tradable Asset Z + 40% Future Outlook Z + 2% Career Awards Z + 3% Draft Value Z", "Re-weights automatically across whatever's actually filled in for that player", "|", "GENERATION 9 - THE FAMILY REUNION", "(Team Summary tab)", "|-- Current Team Strength   <- active roster only (Starter/Bench/IR), 95% TAZ + 5% FOz", "|     Answers: is this team good right now?", "|-- Future Team Strength    <- whole roster, weighted by Age Multiplier, Taxi floor-at-0 protected", "|     Answers: how good is this team's long-term outlook, weighted toward youth?", "'-- Overall Composite       <- simple average of Composite Score, whole roster, Taxi floor-at-0", "Answers: overall, is this a good team?", "|", "GENERATION 10 - THE LEGACY", "Overall GM Power Rank  <- every team, ranked by Overall Composite", "-- A SEPARATE BRANCH OF THE FAMILY --", "DRAFT PICK VALUES (never touches a player's Composite Score)", "|-- Blended Rank Per Year   <- Current + Future Team Strength (2027: 90/10, 2028: 60/40, 2029: 30/70)", "'-- Draft Pick Value        <- Blended Rank + Round Chart, linear interpolation worst-to-best team", "A companion visual version of this whole tree (with real formula cards, generation by", "generation) is available as a standalone file - ask for the formula family tree graphic."]}, {"title": "FUTURE OUTLOOK SCALE (1-10)", "items": ["1-2 near zero \u00b7 3-4 fading/replaceable \u00b7 5-6 stable \u00b7 7-8 strong \u00b7 9-10 elite core asset", "Cell auto color-bands red-to-green to match the score"]}, {"title": "INJURY RISK SCALE (1-5)", "items": ["1 iron man \u00b7 2 minor/occasional \u00b7 3 missed time once \u00b7 4 recurring \u00b7 5 chronic/ongoing"]}, {"title": "CAREER AWARDS POINTS", "items": ["MVP=10 \u00b7 DPOY=8 \u00b7 All-NBA 1st=6 \u00b7 All-NBA 2nd/3rd=4 \u00b7 ROY=5 \u00b7 All-Rookie 1st=2 \u00b7 All-Def 1st=3 \u00b7 All-Def 2nd=2 \u00b7 Title=2 each", "No All-Star or Finals/Playoff awards counted"]}]}, "priorSeasonBoxScore": {"S. Castle": {"mpg": 26.7, "gp": 81, "ppg": 14.7, "rpg": 3.7, "apg": 4.1, "stl": 0.9, "blk": 0.3, "tov": 2.2, "3pm": 1.2}, "S. Barnes": {"mpg": 32.8, "gp": 65, "ppg": 19.3, "rpg": 7.7, "apg": 5.8, "stl": 1.4, "blk": 1.0, "tov": 2.8, "3pm": 1.2}, "D. Clinga   "Future Outlook Z-Score": "Future Outlook standardized the same way.",
  "Composite Score": "48% Tradable Asset Z-Score + 35% Future Outlook Z-Score + 14% Career Awards + 3% Draft Value - the single number behind every ranking on this sheet.",
  "Current Team Strength": "Active roster only (Starter/Bench/IR) - 95% Tradable Asset Z-Score + 5% Future Outlook Z-Score. Answers: is this team good right now?",
  "Future Team Strength": "Whole roster, weighted by Age Multiplier so younger players count more. Taxi floor-at-0 protected - a bad flier can't drag it down.",
  "Overall Composite": "Simple average of Composite Score across the whole roster. Same Taxi floor-at-0 protection.",
  "Overall GM Power Rank": "Every team, ranked by Overall Composite."
};
function getColumnInfo(header){
  const clean = header.replace(/\s*\(calc\)\s*/, '').replace(/\s*\(1-10\)\s*/, '').trim();
  if(COLUMN_INFO[clean]) return COLUMN_INFO[clean];
  if(/PPG$/.test(clean)) return 'Points per game - real input, not calculated.';
  if(/RPG$/.test(clean)) return 'Rebounds per game - real input, not calculated.';
  if(/APG$/.test(clean)) return 'Assists per game - real input, not calculated.';
  if(/STL$/.test(clean)) return 'Steals per game - real input, not calculated.';
  if(/BLK$/.test(clean)) return 'Blocks per game - real input, not calculated.';
  if(/TOV$/.test(clean)) return 'Turnovers per game - real input, not calculated.';
  if(/3PM$/.test(clean)) return '3-pointers made per game - real input, not calculated.';
  return null;
}


const SEASON_TOGGLE_COLS = ['MPG','GP','2025-26 PPG','2025-26 RPG','2025-26 APG','2025-26 STL','2025-26 BLK','2025-26 TOV','2025-26 3PM'];
const PRIOR_KEY_MAP = { 'MPG':'mpg', 'GP':'gp', '2025-26 PPG':'ppg', '2025-26 RPG':'rpg', '2025-26 APG':'apg', '2025-26 STL':'stl', '2025-26 BLK':'blk', '2025-26 TOV':'tov', '2025-26 3PM':'3pm' };

function buildRosterRowsForSeason(){
  const d = DATA.rosters;
  const headers = d.headers.slice();
  const nameIdx = headers.indexOf('Player');
  if(state.season === 'current'){
    return { headers, rows: d.rows };
  }
  if(state.season === 'next'){
    // 2026-27 hasn't started - same roster, box-score columns blank and ready
    const nextHeaders = headers.map(h => SEASON_TOGGLE_COLS.includes(h) ? h.replace('2025-26','2026-27') : h);
    const rows = d.rows.map(row => row.map((v, i) => SEASON_TOGGLE_COLS.includes(headers[i]) ? '' : v));
    return { headers: nextHeaders, rows };
  }
  // Prior season view: swap the 9 raw box-score columns, blank if no prior data
  const swappedHeaders = headers.map(h => SEASON_TOGGLE_COLS.includes(h) ? h.replace('2025-26','2024-25') : h);
  const rows = d.rows.map(row => {
    const pname = row[nameIdx];
    const prior = DATA.priorSeasonBoxScore[pname];
    return row.map((v, i) => {
      const h = headers[i];
      if(!SEASON_TOGGLE_COLS.includes(h)) return v;
      if(!prior) return '';
      return prior[PRIOR_KEY_MAP[h]];
    });
  });
  return { headers: swappedHeaders, rows };
}

function isNumericCol(rows, colIdx){
  let sawNumber = false;
  for(const row of rows){
    const v = row[colIdx];
    if(v === null || v === undefined || v === '') continue;
    if(typeof v === 'number'){ sawNumber = true; }
    else return false;
  }
  return sawNumber;
}

function fmtNum(v){
  if(v === null || v === undefined || v === '') return '';
  if(Number.isInteger(v)) return v.toString();
  return v.toFixed(2);
}

function renderTable(){
  const d = state.tab === 'rosters' ? buildRosterRowsForSeason() : DATA[state.tab];
  const headers = d.headers;
  const calcSet = new Set(DATA[state.tab].calcCols || []);
  let rows = d.rows.slice();

  const numericCols = headers.map((_, i) => isNumericCol(d.rows, i));

  if(state.sortCol !== null){
    const idx = state.sortCol;
    const numeric = numericCols[idx];
    rows.sort((a, b) => {
      let av = a[idx], bv = b[idx];
      const aEmpty = (av === null || av === undefined || av === '');
      const bEmpty = (bv === null || bv === undefined || bv === '');
      if(aEmpty && bEmpty) return 0;
      if(aEmpty) return 1;
      if(bEmpty) return -1;
      if(numeric) return (av - bv) * state.sortDir;
      return String(av).localeCompare(String(bv)) * state.sortDir;
    });
  }

  let html = '<table><thead><tr>';
  headers.forEach((h, i) => {
    const sorted = state.sortCol === i;
    const arrow = sorted ? (state.sortDir === 1 ? '\u25B2' : '\u25BC') : '';
    const dot = calcSet.has(h) ? '<span class="calc-dot"></span>' : '';
    html += `<th class="${sorted ? 'sorted' : ''}" data-col="${i}">${h}${dot}${arrow ? ` <span class="arrow">${arrow}</span>` : ''}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(row => {
    html += '<tr>';
    row.forEach((v, i) => {
      const numeric = numericCols[i];
      const isProse = headers[i] === 'Archetype Description' || headers[i] === 'Manager Archetype';
      let cls = '';
      let display = v;
      if(v === null || v === undefined || v === ''){
        display = ''; cls = 'empty';
      } else if(numeric){
        cls = 'num';
        if(v > 0.001) cls += ' pos';
        else if(v < -0.001) cls += ' neg';
        display = fmtNum(v);
      } else if(isProse){
        cls = 'prose';
      }
      html += `<td class="${cls}">${display}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;

  document.querySelectorAll('thead th').forEach(th => {
    let pressTimer = null;
    let longPressed = false;
    let startX = 0, startY = 0;

    const showTooltip = (x, y) => {
      const colIdx = parseInt(th.dataset.col);
      const info = getColumnInfo(headers[colIdx]);
      if(!info) return;
      longPressed = true;
      th.classList.add('pressed');
      const tt = document.getElementById('colTooltip');
      tt.innerHTML = `<div class="tt-title">${headers[colIdx].replace(/\s*\(calc\)\s*/, '')}</div>${info}`;
      tt.style.display = 'block';
      const vw = window.innerWidth;
      let left = Math.min(Math.max(12, x - 140), vw - 292);
      tt.style.left = left + 'px';
      tt.style.top = Math.max(12, y - 10) + 'px';
    };
    const hideTooltip = () => {
      document.getElementById('colTooltip').style.display = 'none';
      th.classList.remove('pressed');
    };
    const startPress = (x, y) => {
      longPressed = false;
      startX = x; startY = y;
      pressTimer = setTimeout(() => showTooltip(x, y), 480);
    };
    const cancelPress = () => {
      clearTimeout(pressTimer);
      // Don't hide here - a long-press tooltip should stay up until the
      // user taps elsewhere (handled by the global dismiss listener below).
      const wasLong = longPressed;
      longPressed = false;
      return wasLong;
    };

    th.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      startPress(t.clientX, t.clientY);
    }, { passive: true });
    th.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if(Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10){
        clearTimeout(pressTimer);
      }
    }, { passive: true });
    th.addEventListener('touchend', () => {
      const wasLong = cancelPress();
      if(!wasLong){
        const col = parseInt(th.dataset.col);
        if(state.sortCol === col){ state.sortDir *= -1; }
        else { state.sortCol = col; state.sortDir = -1; }
        renderTable();
      }
    });

    th.addEventListener('mousedown', (e) => startPress(e.clientX, e.clientY));
    th.addEventListener('mouseleave', () => { clearTimeout(pressTimer); });
    th.addEventListener('mouseup', () => {
      const wasLong = cancelPress();
      if(!wasLong){
        const col = parseInt(th.dataset.col);
        if(state.sortCol === col){ state.sortDir *= -1; }
        else { state.sortCol = col; state.sortDir = -1; }
        renderTable();
      }
    });
  });

  renderLegend(d);
}

function renderLegend(d){
  const notes = d.notes || [];
  const hasCalc = (d.calcCols || []).length > 0;
  if(notes.length === 0 && !hasCalc){
    document.getElementById('legend').innerHTML = '';
    return;
  }
  let html = '<div class="legend-title">Column Notes</div>';
  notes.forEach(n => {
    html += `<div class="legend-item"><b>${n.label}:</b> ${n.note}</div>`;
  });
  if(hasCalc){
    html += `<div class="legend-item"><span class="legend-dot"></span>auto-calculated, not a manual input</div>`;
  }
  document.getElementById('legend').innerHTML = html;
}

function renderReadme(){
  const rm = DATA.readme;
  let html = `<div class="readme"><div class="readme-hero"><h2>${rm.title}</h2><p>${rm.subtitle}</p></div>`;
  rm.sections.forEach(s => {
    html += '<div class="rm-section">';
    if(s.title) html += `<div class="rm-section-title">${s.title}</div>`;
    if(s.title === 'THE FORMULA FAMILY TREE'){
      s.items.forEach(it => {
        const esc = it.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        if(/^GENERATION \d+/.test(it)){
          html += `<div class="rm-tree gen">${esc}</div>`;
        } else if(it.startsWith('(') || it.startsWith('Answers:')){
          html += `<div class="rm-tree sub">${esc}</div>`;
        } else {
          html += `<div class="rm-tree">${esc}</div>`;
        }
      });
    } else {
      s.items.forEach(it => {
        html += `<div class="rm-item">${it}</div>`;
      });
    }
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('tableWrap').innerHTML = html;
  document.getElementById('legend').innerHTML = '';
}

function render(){
  const hint = document.getElementById('hint');
  const seasonToggle = document.getElementById('seasonToggle');
  seasonToggle.style.display = (state.tab === 'rosters') ? 'flex' : 'none';
  if(state.tab === 'readme'){
    hint.style.display = 'none';
    renderReadme();
  } else {
    hint.style.display = 'block';
    renderTable();
  }
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    state.sortCol = null;
    state.sortDir = 1;
    render();
  });
});

document.addEventListener('touchstart', (e) => {
  if(!e.target.closest('th')){
    document.getElementById('colTooltip').style.display = 'none';
    document.querySelectorAll('th.pressed').forEach(t => t.classList.remove('pressed'));
  }
}, { passive: true });
document.addEventListener('click', (e) => {
  if(!e.target.closest('th')){
    document.getElementById('colTooltip').style.display = 'none';
    document.querySelectorAll('th.pressed').forEach(t => t.classList.remove('pressed'));
  }
});

document.querySelectorAll('.season-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.season = btn.dataset.season;
    state.sortCol = null;
    state.sortDir = 1;
    render();
  });
});

render();
</script>

</body>
</html>
