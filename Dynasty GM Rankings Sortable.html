<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynasty GM Power Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111111;
    --panel:#1c1c1e;
    --panel-2:#242426;
    --line:#2a2a2c;
    --amber:#ff9f0a;
    --amber-dim:#8a5a10;
    --wood:#c4956c;
    --text:#e8eaf0;
    --text-dim:#8e8e93;
    --text-faint:#48484a;
    --pos:#30d158;
    --neg:#ff453a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,#1c1c1e 0%, #111111 100%);
    border-bottom:1px solid var(--line);
    padding:14px 16px 0 16px;
  }
  .title-row{display:flex; align-items:baseline; gap:10px; margin-bottom:12px;}
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
    text-transform:uppercase;
  }
  .tabs{ display:flex; gap:4px; }
  .tab{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    padding:9px 14px 10px 14px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tab.active{ color:var(--amber); border-bottom-color:var(--amber); }
  .season-toggle{ display:flex; gap:6px; padding:8px 0 10px 0; }
  .season-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:500;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:5px 12px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .season-btn.active{ color:var(--bg); background:var(--wood); border-color:var(--wood); font-weight:600; }
  .hint{
    padding:7px 16px;
    font-size:11px;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .table-wrap{
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    max-height:calc(100vh - 118px);
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  thead th{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--panel-2);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    text-align:left;
    padding:9px 10px;
    border-bottom:2px solid var(--line);
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
  }
  thead th:hover{ color:var(--amber); }
  thead th.sorted{ color:var(--amber); background:#262b35; }
  thead th .arrow{ margin-left:4px; opacity:0.7; font-size:9px; }
  thead th .calc-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--wood);
    margin-left:5px;
    vertical-align:middle;
    opacity:0.8;
  }
  thead th:first-child, tbody td:first-child{
    position:sticky; left:0; z-index:5;
    background:var(--panel-2);
    box-shadow: 3px 0 6px -2px rgba(0,0,0,0.55);
  }
  tbody td:first-child{ background:var(--panel); font-family:'Inter',sans-serif; font-weight:500; }
  tbody tr:nth-child(even) td:first-child{ background:#171a20; }
  tbody td{
    padding:7px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    color:var(--text);
  }
  tbody tr:nth-child(even) td{ background:#171a20; }
  tbody tr:hover td{ background:#252a34; }
  tbody tr:hover td:first-child{ background:#252a34; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  td.prose{ font-family:'Inter',sans-serif; white-space:normal; max-width:320px; line-height:1.4; }
  td.prose-label{ white-space:nowrap; max-width:none; font-size:12px; }
  td.prose-wide{ min-width:340px; max-width:340px; font-size:12px; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }   /* stop iOS Safari inflating long text runs */
  td.pos{ color:var(--pos); }
  td.neg{ color:var(--neg); }
  .empty{ color:var(--text-faint); }
  .legend{
    padding:12px 16px 20px 16px;
    background:var(--panel);
    border-top:1px solid var(--line);
    font-family:'Inter',sans-serif;
  }
  .legend-title{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .legend-item{
    font-size:11.5px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .legend-item b{ color:var(--wood); font-weight:600; }
  .legend-dot{
    display:inline-block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--wood);
    margin-right:6px;
    vertical-align:middle;
    opacity:0.8;
  }
  .readme{
    padding:18px 16px 40px 16px;
    max-width:640px;
  }
  .readme-hero{ margin-bottom:22px; }
  .readme-hero h2{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    color:var(--amber);
    margin:0 0 4px 0;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .readme-hero p{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    margin:0;
  }
  .rm-section{ margin-bottom:22px; }
  .rm-section-title{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--wood);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  .rm-item{
    font-size:13px;
    line-height:1.55;
    color:var(--text);
    margin-bottom:7px;
    padding-left:14px;
    position:relative;
  }
  .rm-item::before{
    content:'\2013';
    position:absolute;
    left:0;
    color:var(--amber-dim);
  }
  .rm-tree{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    line-height:1.65;
    color:var(--text-dim);
    white-space:pre-wrap;
    margin-bottom:2px;
  }
  .rm-tree.gen{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--amber);
    white-space:normal;
    margin-top:16px;
    margin-bottom:4px;
  }
  .rm-tree.sub{
    color:var(--wood);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    white-space:normal;
    margin-bottom:8px;
  }
  .mgr-filter-wrap{ padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  .tg-wrap{ padding:14px 16px; }
  .tg-intro{ font-size:12.5px; color:var(--text-dim); margin-bottom:18px; line-height:1.5; }
  .tg-side{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:16px;
  }
  .tg-side-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:10px;
  }
  .tg-search{
    width:100%;
    padding:9px 10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    box-sizing:border-box;
  }
  .tg-results{ margin-top:4px; }
  .tg-result-item{
    padding:8px 10px;
    font-size:12.5px;
    color:var(--text-dim);
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .tg-result-item:active{ background:var(--panel-2); }
  .tg-pick-row{
    display:flex;
    gap:6px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .tg-select{
    flex:1;
    min-width:100px;
    padding:8px 6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .tg-add-btn{
    padding:8px 14px;
    background:var(--wood);
    border:none;
    border-radius:8px;
    color:var(--bg);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
  }
  .tg-items{ margin-top:12px; }
  .tg-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
    color:var(--text);
  }
  .tg-val{ color:var(--pos); font-family:'IBM Plex Mono',monospace; }
  .tg-remove{
    background:none;
    border:1px solid var(--neg);
    color:var(--neg);
    border-radius:50%;
    width:22px;
    height:22px;
    font-size:14px;
    line-height:1;
  }
  .tg-empty{ color:var(--text-faint); font-size:12px; font-style:italic; padding:6px 0; }
  .tg-subtotal{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .tg-result{
    text-align:center;
    background:var(--panel-2);
    border:2px solid var(--amber);
    border-radius:14px;
    padding:20px;
  }
  .tg-result-label{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .tg-result-num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:40px;
  }
  .tg-reset{
    margin-top:16px;
    padding:9px 20px;
    background:none;
    border:1px solid var(--text-faint);
    border-radius:20px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .tg-download{
    margin-top:16px;
    margin-left:8px;
    padding:9px 20px;
    background:var(--amber);
    border:none;
    border-radius:20px;
    color:var(--bg);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
  }
  .tg-change-team{
    margin-top:10px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-decoration:underline;
    padding:0;
  }
  .tg-remove-team{
    background:none;
    border:1px solid var(--neg);
    color:var(--neg);
    border-radius:12px;
    padding:2px 8px;
    font-size:10px;
    font-family:'IBM Plex Mono',monospace;
    margin-left:8px;
  }
  .tg-add-team-btn{
    width:100%;
    padding:12px;
    background:none;
    border:1px dashed var(--line);
    border-radius:12px;
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    text-transform:uppercase;
    margin-bottom:16px;
  }
  .tg-result-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--text);
    gap:6px;
  }
  .tg-to{
    color:var(--wood);
    font-size:11px;
    margin-left:6px;
  }
  .tg-net-pos{ color:var(--pos); font-weight:700; }
  .tg-net-neg{ color:var(--neg); font-weight:700; }
  .col-tooltip{
    position:fixed;
    z-index:999;
    max-width:280px;
    background:var(--panel-2, #1b2029);
    border:1px solid var(--wood);
    border-radius:10px;
    padding:12px 14px;
    font-size:12.5px;
    line-height:1.5;
    color:var(--text);
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    display:none;
  }
  .col-tooltip .tt-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    color:var(--wood);
    text-transform:uppercase;
    font-size:12.5px;
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  th.pressed{ background:var(--panel-2, #1b2029); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="topbar">
  <div class="title-row">
    <h1>Dynasty GM Power Rankings</h1>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="teamSummary">Team Summary</button>
    <button class="tab" data-tab="rosters">Rosters</button>
    <button class="tab" data-tab="tradeGrade">Trade Grade</button>
    <button class="tab" data-tab="readme">Read Me</button>
  </div>
  <div class="filter-row" id="filterRow" style="display:none; gap:8px; padding:8px 16px;">
    <div class="season-toggle" id="seasonToggle" style="flex:1; display:flex;">
      <select id="seasonSelect" class="tg-select" style="width:100%;">
        <option value="prior">2024-25</option>
        <option value="s2526">2025-26</option>
        <option value="next">2026-27 (this season)</option>
        <option value="current" selected>Model inputs (season blend)</option>
      </select>
    </div>
    <div class="mgr-filter-wrap" id="mgrFilterWrap" style="flex:1; display:flex;">
      <select id="mgrFilterSelect" class="tg-select" style="width:100%;">
        <option value="all">All Managers</option>
      </select>
    </div>
  </div>
  <div class="search-row" id="searchRow" style="display:none; padding:0 16px 8px;">
    <input type="text" id="playerSearchInput" class="tg-select" placeholder="Search player name…" style="width:100%; box-sizing:border-box;" autocomplete="off">
  </div>
</div>
<div class="hint" id="hint">Tap any column header to sort. Tap again to reverse.</div>
<div class="table-wrap" id="tableWrap"></div>
<div class="legend" id="legend"></div>
<div class="col-tooltip" id="colTooltip"></div>

ue Rank, Rookie Opportunity Score", "   |", "GENERATION 1 - FIRST CHILDREN", "  |-- Fantasy Score/Gm            <- Box Score Stats", "  |     PTS x0.5 + REB + AST + STL x2 + BLK x2 - TOV + 3PM x0.5", "  |-- Prior Season Fantasy Score  <- Prior Season Stats (same formula, 2024-25)", "  |-- Draft Value                 <- Draft Pick  =  61 - Pick", "  |-- Age Multiplier              <- Age  (legacy - no longer feeds TAG; kept for reference)", "  |-- Injury Multiplier           <- Injury Risk  =  1 - (Risk-1) x 0.05", "  |-- Draft Pedigree Multiplier   <- Draft Pick + rookie/soph status (legacy - no longer feeds TAG)", "  '-- Future Outlook (1-10)       <- WS/48 League Rank + Age + MPG (established players)", "        or a real researched score for true rookies (see rubric below)", "        established-player formula: league percentile + steep age curve + minutes-trust dampening", "   |", "GENERATION 2 - BLENDING THE SEASONS", "  |-- Multi-Year Blended Score    <- Fantasy Score + Prior Season FS", "  |     65/35 current-weighted split - flips to 35/65 if under 25 GP this season", "  '-- Minutes Trust Weight        <- MPG  =  MIN(1, MAX(0.4, MPG/30))", "   |", "GENERATION 3 - THREE WAYS TO READ A SEASON", "  |-- Per-36 Fantasy Score        <- Multi-Year Blended + MPG (minutes-normalized)", "  |-- Per-100-Poss Fantasy Score  <- Multi-Year Blended + MPG + Team Pace (pace-normalized)", "  '-- Rookie/Sophomore Trust Wt   <- GP + rookie status (Yr1: 0.5->1.0, Yr2: 0.75->1.0, Yr3+: 1.0)", "   |", "GENERATION 4 - BLENDED PRODUCTION", "  Blended Production  <- Multi-Year + Per-36 + Per-100 + Minutes Trust Weight", "  MinutesTrust x AVG(3 reads) + (1-MinutesTrust) x MultiYear", "   |", "GENERATION 5 - ADJUSTED PRODUCTION", "  Adjusted Production  <- Blended Production + Rookie/Sophomore Trust Weight", "  TrustWeight x BlendedProduction + (1-TrustWeight) x LeagueAvg", "   |", "GENERATION 6 - TRADABLE ASSET GRADE (cost to acquire, 0-100, 100 = most valuable asset in the league)", "  Script-written (fill_tag_v2.py): projected fantasy production over 8 seasons (0.95/yr taper), valued above replacement (80th best) with a star premium", "  Base = real per-game production (Multi-Year Blended); no-game rookies projected from draft slot; growth to age 25 (high picks grow more), decline 9%/yr from 32, retirement risk from 35", "  Discounts: missed time (light, heavier with age; a full lost season is not double-counted with Injury Risk), Injury Risk 2%/level, no NBA games -16%, one NBA season -12%", "  Calibrated against Dynatyze dynasty consensus (Oct 2026); league-wide rules only - no per-player overrides", "   |", "GENERATION 7 - STANDING THEM UP AGAINST THE LEAGUE", "  |-- Tradable Asset Z-Score      <- Tradable Asset Grade, standardized vs all players", "  '-- Future Outlook Z-Score      <- Future Outlook, standardized vs all 182 rostered players", "   |", "GENERATION 8 - THE MARRIAGE", "  COMPOSITE SCORE  =  80% Tradable Asset Z + 15% Future Outlook Z + 2% Career Awards Z + 3% Draft Value Z", "  Re-weights automatically across what's filled in. TRADE VALUE = Composite minus the worst rostered player's Composite (replacement level = 0)", "   |", "GENERATION 9 - THE FAMILY REUNION", "  (Team Summary tab)", "  |-- Current Team Strength   <- average of the top 10 active players (Starter/Bench/IR), 95% Current Production Z + 5% FOz", "  |     Current Production = Adjusted Production x Injury Mult. Answers: is this team good right now?", "  |-- Future Team Strength    <- average of the top 15 players by Trade Value x Youth Weight (1.2 at age 20 down to 0.5 floor)", "  |     Answers: how good is this team's long-term outlook, weighted toward youth?", "  '-- Overall Composite       <- average Trade Value of the top 15 players (fringe depth can't help or hurt)", "        Answers: overall, is this a good team?", "   |", "GENERATION 10 - THE LEGACY", "  Overall GM Power Rank  <- every team, ranked by Overall Composite", "-- A SEPARATE BRANCH OF THE FAMILY }

const PRIOR_KEY_MAP = { 'MPG':'mpg', 'GP':'gp', '2025-26 PPG':'ppg', '2025-26 RPG':'rpg', '2025-26 APG':'apg', '2025-26 STL':'stl', '2025-26 BLK':'blk', '2025-26 TOV':'tov', '2025-26 3PM':'3pm' };

function buildRosterRowsForSeason(){
  const d = DATA.rosters;
  const headers = d.headers.slice();
  const nameIdx = headers.indexOf('Player');
  if(state.season === 'current'){
    // Model inputs: per-game stats are the season blend (w x 2026-27 + (1-w) x 2025-26, w = GP/(GP+25))
    return { headers: headers.map(h => h.replace('2025-26 ', '')), rows: d.rows };
  }
  if(state.season === 's2526' || state.season === 'next'){
    // Real single-season stats from the Season Data sheet (rookies with no 2025-26 games show blank there)
    const label = state.season === 'next' ? '2026-27' : '2025-26';
    const src = (DATA.seasonBox || {})[label] || {};
    const teamIdx = headers.indexOf('NBA Team');
    const viewHeaders = headers.map(h => SEASON_VIEW_COLS.includes(h) ? (h.startsWith('2025-26') ? h.replace('2025-26', label) : label.slice(2) + ' ' + h) : h);
    const rows = d.rows.map(row => {
      const rec = src[row[nameIdx] + '|' + row[teamIdx]];
      return row.map((v, i) => SEASON_VIEW_COLS.includes(headers[i]) ? (rec ? rec[SEASON_KEY_MAP[headers[i]]] ?? '' : '') : v);
    });
    return { headers: viewHeaders, rows };
  }
  // Prior season view: swap the 9 raw box-score columns, blank if no prior data
  const swappedHeaders = headers.map(h => SEASON_TOGGLE_COLS.includes(h) ? h.replace('2025-26','2024-25') : h);
  const rows = d.rows.map(row => {
    const pname = row[nameIdx];
    const prior = DATA.priorSeasonBoxScore[pname];
    return row.map((v, i) => {
      const h = headers[i];
      if(['USG%','TS%','EPM'].includes(h)) return '';   // no 2024-25 advanced stats stored
      if(!SEASON_TOGGLE_COLS.includes(h)) return v;
      if(!prior) return '';
      return prior[PRIOR_KEY_MAP[h]];
    });
  });
  return { headers: swappedHeaders, rows };
}

function isNumericCol(rows, colIdx){
  let sawNumber = false;
  for(const row of rows){
    const v = row[colIdx];
    if(v === null || v === undefined || v === '') continue;
    if(typeof v === 'number'){ sawNumber = true; }
    else return false;
  }
  return sawNumber;
}

function fmtNum(v){
  if(v === null || v === undefined || v === '') return '';
  if(Number.isInteger(v)) return v.toString();
  return v.toFixed(2);
}

function populateMgrFilter(){
  const sel = document.getElementById('mgrFilterSelect');
  if(sel.dataset.populated) return;
  const h = DATA.rosters.headers;
  const mgrIdx = h.indexOf('Manager');
  const managers = [...new Set(DATA.rosters.rows.map(r => r[mgrIdx]).filter(m => m))].sort();
  managers.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    sel.appendChild(opt);
  });
  if(DATA.rosters.rows.some(r => !r[mgrIdx])){
    const opt = document.createElement('option');
    opt.value = '__unassigned__';
    opt.textContent = 'Unassigned (dropped)';
    sel.appendChild(opt);
  }
  sel.dataset.populated = 'true';
  sel.addEventListener('change', () => {
    state.mgrFilter = sel.value;
    renderTable();
  });
}

function renderTable(){
  const d = state.tab === 'rosters' ? buildRosterRowsForSeason() : DATA[state.tab];
  const headers = d.headers;
  const calcSet = new Set(DATA[state.tab].calcCols || []);
  let rows = d.rows.slice();

  if(state.tab === 'rosters' && state.mgrFilter !== 'all'){
    const mgrIdx = headers.indexOf('Manager');
    rows = state.mgrFilter === '__unassigned__'
      ? rows.filter(r => !r[mgrIdx])
      : rows.filter(r => r[mgrIdx] === state.mgrFilter);
  }

  if(state.tab === 'rosters' && state.playerSearch.trim() !== ''){
    const playerIdx = headers.indexOf('Player');
    const q = state.playerSearch.trim().toLowerCase();
    rows = rows.filter(r => String(r[playerIdx] || '').toLowerCase().includes(q));
  }

  // Default view: group by manager so each GM's roster stays together,
  // rather than sitting in raw sheet row order (which mixes teams).
  // Only applies before the user explicitly taps a column to sort.
  if(state.tab === 'rosters' && state.mgrFilter === 'all' && state.sortCol === null){
    const mgrIdx = headers.indexOf('Manager');
    const mgrOrder = [];
    rows.forEach(r => { if(!mgrOrder.includes(r[mgrIdx])) mgrOrder.push(r[mgrIdx]); });
    rows.sort((a, b) => mgrOrder.indexOf(a[mgrIdx]) - mgrOrder.indexOf(b[mgrIdx]));
  }

  const numericCols = headers.map((_, i) => isNumericCol(d.rows, i));

  if(state.sortCol !== null){
    const idx = state.sortCol;
    const numeric = numericCols[idx];
    rows.sort((a, b) => {
      let av = a[idx], bv = b[idx];
      const aEmpty = (av === null || av === undefined || av === '');
      const bEmpty = (bv === null || bv === undefined || bv === '');
      if(aEmpty && bEmpty) return 0;
      if(aEmpty) return 1;
      if(bEmpty) return -1;
      if(numeric) return (av - bv) * state.sortDir;
      return String(av).localeCompare(String(bv)) * state.sortDir;
    });
  }

  // Roster Slot stays in the data (Current Team Strength + trade grader use it) but isn't shown
  const hiddenIdx = state.tab === 'rosters' ? headers.indexOf('Roster Slot') : -1;
  let html = '<table><thead><tr>';
  headers.forEach((h, i) => {
    if(i === hiddenIdx) return;
    const sorted = state.sortCol === i;
    const arrow = sorted ? (state.sortDir === 1 ? '\u25B2' : '\u25BC') : '';
    const dot = calcSet.has(h) ? '<span class="calc-dot"></span>' : '';
    html += `<th class="${sorted ? 'sorted' : ''}" data-col="${i}">${h}${dot}${arrow ? ` <span class="arrow">${arrow}</span>` : ''}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(row => {
    html += '<tr>';
    row.forEach((v, i) => {
      if(i === hiddenIdx) return;
      const numeric = numericCols[i];
      const isProse = headers[i] === 'Archetype Description' || headers[i] === 'Manager Archetype';
      let cls = '';
      let display = v;
      if(v === null || v === undefined || v === ''){
        display = ''; cls = 'empty';
      } else if(numeric){
        cls = 'num';
        if(v > 0.001) cls += ' pos';
        else if(v < -0.001) cls += ' neg';
        display = fmtNum(v);
      } else if(isProse){
        cls = headers[i] === 'Archetype Description' ? 'prose prose-wide' : 'prose prose-label';
      }
      html += `<td class="${cls}">${display}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;

  document.querySelectorAll('thead th').forEach(th => {
    let pressTimer = null;
    let longPressed = false;
    let startX = 0, startY = 0;

    const showTooltip = (x, y) => {
      const colIdx = parseInt(th.dataset.col);
      const info = getColumnInfo(headers[colIdx]);
      if(!info) return;
      longPressed = true;
      th.classList.add('pressed');
      const tt = document.getElementById('colTooltip');
      tt.innerHTML = `<div class="tt-title">${headers[colIdx].replace(/\s*\(calc\)\s*/, '')}</div>${info}`;
      tt.style.display = 'block';
      const vw = window.innerWidth;
      let left = Math.min(Math.max(12, x - 140), vw - 292);
      tt.style.left = left + 'px';
      tt.style.top = Math.max(12, y - 10) + 'px';
    };
    const hideTooltip = () => {
      document.getElementById('colTooltip').style.display = 'none';
      th.classList.remove('pressed');
    };
    const startPress = (x, y) => {
      longPressed = false;
      startX = x; startY = y;
      pressTimer = setTimeout(() => showTooltip(x, y), 480);
    };
    const cancelPress = () => {
      clearTimeout(pressTimer);
      // Don't hide here - a long-press tooltip should stay up until the
      // user taps elsewhere (handled by the global dismiss listener below).
      const wasLong = longPressed;
      longPressed = false;
      return wasLong;
    };

    th.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      startPress(t.clientX, t.clientY);
    }, { passive: true });
    th.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if(Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10){
        clearTimeout(pressTimer);
      }
    }, { passive: true });
    th.addEventListener('touchend', () => {
      const wasLong = cancelPress();
      if(!wasLong){
        const col = parseInt(th.dataset.col);
        if(state.sortCol === col){ state.sortDir *= -1; }
        else { state.sortCol = col; state.sortDir = -1; }
        renderTable();
      }
    });

    th.addEventListener('mousedown', (e) => startPress(e.clientX, e.clientY));
    th.addEventListener('mouseleave', () => { clearTimeout(pressTimer); });
    th.addEventListener('mouseup', () => {
      const wasLong = cancelPress();
      if(!wasLong){
        const col = parseInt(th.dataset.col);
        if(state.sortCol === col){ state.sortDir *= -1; }
        else { state.sortCol = col; state.sortDir = -1; }
        renderTable();
      }
    });
  });

  renderLegend(d);
}

function renderLegend(d){
  const notes = d.notes || [];
  const hasCalc = (d.calcCols || []).length > 0;
  if(notes.length === 0 && !hasCalc){
    document.getElementById('legend').innerHTML = '';
    return;
  }
  let html = '<div class="legend-title">Column Notes</div>';
  notes.forEach(n => {
    html += `<div class="legend-item"><b>${n.label}:</b> ${n.note}</div>`;
  });
  if(hasCalc){
    html += `<div class="legend-item"><span class="legend-dot"></span>auto-calculated, not a manual input</div>`;
  }
  document.getElementById('legend').innerHTML = html;
}

let tradeState = {
  A: { manager: null, players: [], picks: [], lastDest: null },
  B: { manager: null, players: [], picks: [], lastDest: null },
  C: { manager: null, players: [], picks: [], lastDest: null },
};
let tgActiveSides = ['A', 'B']; // C is added on demand

function getPlayerComposite(name, nba){
  const h = DATA.rosters.headers;
  const nameIdx = h.indexOf('Player');
  const nbaIdx = h.indexOf('NBA Team');
  const compIdx = h.indexOf('Trade Value') >= 0 ? h.indexOf('Trade Value') : h.indexOf('Composite Score');
  const mgrIdx = h.indexOf('Manager');
  const row = DATA.rosters.rows.find(r => r[nameIdx] === name && r[nbaIdx] === nba);
  return row ? { comp: row[compIdx], mgr: row[mgrIdx] } : null;
}

function getPickValue(mgr, pickLabel){
  const h = DATA.draftPicks.headers;
  const mgrIdx = h.indexOf('Manager');
  const pickIdx = h.indexOf(pickLabel);
  const row = DATA.draftPicks.rows.find(r => r[mgrIdx] === mgr);
  return row ? row[pickIdx] : null;
}

function tradeSideTotal(side){
  let total = 0;
  side.players.forEach(p => total += p.comp);
  side.picks.forEach(p => total += p.value * 0.35);
  return total;
}

function tgManagerList(){
  return DATA.draftPicks.rows.map(r => r[0]);
}

function tgAddThirdTeam(){
  if(!tgActiveSides.includes('C')) tgActiveSides.push('C');
  renderTradeGrade();
}

function tgRemoveThirdTeam(){
  tgActiveSides = tgActiveSides.filter(s => s !== 'C');
  tradeState.C = { manager: null, players: [], picks: [] };
  renderTradeGrade();
}

function tgSetManager(sideKey, mgr){
  tradeState[sideKey].manager = mgr || null;
  tradeState[sideKey].players = [];
  tradeState[sideKey].picks = [];
  tradeState[sideKey].lastDest = null;
  renderTradeGrade();
}

function renderTradeGrade(){
  const managers = tgManagerList();

  // Self-healing: if any earlier item was added before a valid destination
  // existed (e.g. added to Team A before Team B had a manager selected),
  // it would have been stored with an undefined "to". Fix those now that
  // real destinations exist, rather than letting them silently corrupt
  // the net value math.
  tgActiveSides.forEach(sideKey => {
    const side = tradeState[sideKey];
    if(!side.manager) return;
    const otherSides = tgActiveSides.filter(s => s !== sideKey && tradeState[s].manager);
    if(otherSides.length === 0) return;
    const fallback = otherSides.length === 1 ? otherSides[0] : (side.lastDest && otherSides.includes(side.lastDest) ? side.lastDest : otherSides[0]);
    side.players.forEach(p => { if(!p.to || !tradeState[p.to] || !tradeState[p.to].manager) p.to = fallback; });
    side.picks.forEach(p => { if(!p.to || !tradeState[p.to] || !tradeState[p.to].manager) p.to = fallback; });
  });
  const otherSideLabel = (sideKey, toKey) => {
    const map = {A:'Team A', B:'Team B', C:'Team C'};
    return map[toKey] || toKey;
  };

  const sideBlock = (sideKey, label) => {
    const side = tradeState[sideKey];
    const mgr = side.manager;

    if(!mgr){
      return `
        <div class="tg-side">
          <div class="tg-side-title">${label}</div>
          <select class="tg-select" style="width:100%;" onchange="tgSetManager('${sideKey}', this.value)">
            <option value="">Select team...</option>
            ${managers.map(m => `<option value="${m}">${m}</option>`).join('')}
          </select>
        </div>`;
    }

    const otherSides = tgActiveSides.filter(s => s !== sideKey && tradeState[s].manager);
    const needsDestPicker = otherSides.length > 1;

    let itemsHtml = '';
    side.players.forEach((p, i) => {
      const toLabel = tradeState[p.to] ? `${p.to}: ${tradeState[p.to].manager}` : p.to;
      itemsHtml += `<div class="tg-item">
        <span>${p.name} (${p.nba}) <span class="tg-val">${p.comp.toFixed(2)}</span> <span class="tg-to">→ ${toLabel}</span></span>
        <button class="tg-remove" onclick="removeTradeItem('${sideKey}','players',${i})">×</button>
      </div>`;
    });
    side.picks.forEach((p, i) => {
      const toLabel = tradeState[p.to] ? `${p.to}: ${tradeState[p.to].manager}` : p.to;
      itemsHtml += `<div class="tg-item">
        <span>${p.label} <span class="tg-val">${(p.value*0.35).toFixed(2)}</span> <span class="tg-to">→ ${toLabel}</span></span>
        <button class="tg-remove" onclick="removeTradeItem('${sideKey}','picks',${i})">×</button>
      </div>`;
    });

    // Real rostered players belonging to this manager, for a fast pick-list
    // (still searchable too, for a big roster)
    const h = DATA.rosters.headers;
    const nameIdx = h.indexOf('Player');
    const nbaIdx = h.indexOf('NBA Team');
    const mgrIdx = h.indexOf('Manager');
    const slotIdx = h.indexOf('Roster Slot');
    const compIdx = h.indexOf('Trade Value') >= 0 ? h.indexOf('Trade Value') : h.indexOf('Composite Score');
    const ownPlayers = DATA.rosters.rows
      .filter(r => r[mgrIdx] === mgr && ['Starter','Bench','IR','Taxi'].includes(r[slotIdx]))
      .sort((a,b) => (b[compIdx]||-99) - (a[compIdx]||-99));

    const ownedNames = new Set(side.players.map(p => p.name + '|' + p.nba));
    const playerOptions = ownPlayers
      .filter(r => !ownedNames.has(r[nameIdx] + '|' + r[nbaIdx]))
      .map(r => `<option value="${r[nameIdx]}|${r[nbaIdx]}">${r[nameIdx]} (${r[nbaIdx]}) - ${(r[compIdx]||0).toFixed(2)}</option>`)
      .join('');

    const destPicker = needsDestPicker
      ? `<select id="tgDest${sideKey}" class="tg-select" style="margin-bottom:8px;" onchange="tradeState.${sideKey}.lastDest=this.value;">
           ${otherSides.map(s => `<option value="${s}" ${side.lastDest === s ? 'selected' : ''}>Goes to ${s}: ${tradeState[s].manager}</option>`).join('')}
         </select>`
      : '';

    const total = tradeSideTotal(side);
    const removeTeamBtn = sideKey === 'C' ? `<button class="tg-remove-team" onclick="tgRemoveThirdTeam()">Remove Team C</button>` : '';

    if(otherSides.length === 0){
      return `
        <div class="tg-side">
          <div class="tg-side-title">${label}: ${mgr} ${removeTeamBtn}</div>
          <div class="tg-empty">Select at least one other team before adding players or picks.</div>
          <div class="tg-items">${itemsHtml}</div>
          <button class="tg-change-team" onclick="tgSetManager('${sideKey}', '')">Change team</button>
        </div>`;
    }

    return `
      <div class="tg-side">
        <div class="tg-side-title">${label}: ${mgr} ${removeTeamBtn}</div>
        ${destPicker}
        <select class="tg-select" style="width:100%; margin-bottom:8px;" onchange="tgAddPlayerFromList('${sideKey}', this.value); this.selectedIndex=0;">
          <option value="">Add a player they own...</option>
          ${playerOptions}
        </select>
        <div class="tg-pick-row">
          <select id="tgPickChoice${sideKey}" class="tg-select">
            ${tgPickOptionsFor(mgr)}
          </select>
          <button class="tg-add-btn" onclick="tgAddPick('${sideKey}')">Add Pick</button>
        </div>
        <div class="tg-items">${itemsHtml || '<div class="tg-empty">Nothing added yet</div>'}</div>
        <div class="tg-subtotal">Subtotal: <span class="tg-val">${total.toFixed(2)}</span></div>
        <button class="tg-change-team" onclick="tgSetManager('${sideKey}', '')">Change team</button>
      </div>`;
  };

  const addTeamCBtn = !tgActiveSides.includes('C')
    ? `<button class="tg-add-team-btn" onclick="tgAddThirdTeam()">+ Add a 3rd Team</button>` : '';

  let sidesHtml = sideBlock('A', 'TEAM A') + sideBlock('B', 'TEAM B');
  if(tgActiveSides.includes('C')) sidesHtml += sideBlock('C', 'TEAM C');

  // Net value per team = sum of everything tagged "to: them" minus their own sends
  const activeSides = tgActiveSides.filter(s => tradeState[s].manager);
  const resultBlocks = activeSides.map(s => {
    const sent = tradeSideTotal(tradeState[s]);
    let received = 0;
    activeSides.forEach(other => {
      if(other === s) return;
      tradeState[other].players.forEach(p => { if(p.to === s) received += p.comp; });
      tradeState[other].picks.forEach(p => { if(p.to === s) received += p.value * 0.35; });
    });
    const net = received - sent;
    const netStr = net >= 0 ? `+${net.toFixed(2)}` : net.toFixed(2);
    const netClass = net >= 0 ? 'tg-net-pos' : 'tg-net-neg';
    return `<div class="tg-result-line">
      <span>${tradeState[s].manager}</span>
      <span>recv ${received.toFixed(2)} / sent ${sent.toFixed(2)}</span>
      <span class="${netClass}">${netStr}</span>
    </div>`;
  }).join('');

  const html = `
    <div class="tg-wrap" id="tgWrapForExport">
      <div class="tg-intro">Pick a team, then add whatever they're sending${activeSides.length > 2 ? ' - tag who each item goes to' : ''}. Players are valued by Trade Value (Composite Score measured from replacement level, so every rostered player is a positive asset). Picks are automatically weighted at 35% of their full value.</div>
      ${sidesHtml}
      ${addTeamCBtn}
      <div class="tg-result">
        <div class="tg-result-label">NET VALUE BY TEAM</div>
        ${resultBlocks || '<div class="tg-empty">Select teams to begin</div>'}
        <button class="tg-reset" onclick="tgReset()">Reset Trade</button>
        <button class="tg-download" onclick="tgDownloadImage()">Download Graphic</button>
      </div>
    </div>`;
  document.getElementById('tableWrap').innerHTML = html;
  document.getElementById('legend').innerHTML = '';
}

function tgPickOptionsFor(mgr){
  const po = DATA.pickOwnership;
  const yearIdx = po.headers.indexOf('Year');
  const roundIdx = po.headers.indexOf('Round');
  const origIdx = po.headers.indexOf('Original Owner');
  const holderIdx = po.headers.indexOf('Current Holder');
  const picks = po.rows.filter(r => r[holderIdx] === mgr);
  if(picks.length === 0) return '<option value="">No picks currently held</option>';
  return picks.map((r, i) => {
    const label = `${r[yearIdx]} ${r[roundIdx]} (${r[origIdx]})`;
    return `<option value="${i}" data-year="${r[yearIdx]}" data-round="${r[roundIdx]}" data-orig="${r[origIdx]}">${label}</option>`;
  }).join('');
}

function tgDefaultDest(sideKey){
  const otherSides = tgActiveSides.filter(s => s !== sideKey && tradeState[s].manager);
  if(otherSides.length === 1) return otherSides[0];
  const side = tradeState[sideKey];
  if(side.lastDest && otherSides.includes(side.lastDest)) return side.lastDest;
  const destEl = document.getElementById('tgDest'+sideKey);
  const chosen = destEl ? destEl.value : otherSides[0];
  side.lastDest = chosen;
  return chosen;
}

function tgAddPlayerFromList(sideKey, value){
  if(!value) return;
  const [name, nba] = value.split('|');
  const info = getPlayerComposite(name, nba);
  if(!info || info.comp === null || info.comp === undefined) return;
  const to = tgDefaultDest(sideKey);
  tradeState[sideKey].players.push({ name, nba, comp: info.comp, to });
  renderTradeGrade();
}

function tgAddPick(sideKey){
  const choiceSel = document.getElementById('tgPickChoice'+sideKey);
  const opt = choiceSel.options[choiceSel.selectedIndex];
  if(!opt || !opt.dataset.year) return;
  const year = opt.dataset.year;
  const round = opt.dataset.round;
  const orig = opt.dataset.orig;
  const pickLabel = `${year} ${round}`;
  const value = getPickValue(orig, pickLabel);
  if(value === null || value === undefined) return;
  const displayLabel = `${pickLabel} (${orig})`;
  const to = tgDefaultDest(sideKey);
  tradeState[sideKey].picks.push({ label: displayLabel, value, to });
  renderTradeGrade();
}

function removeTradeItem(sideKey, type, idx){
  tradeState[sideKey][type].splice(idx, 1);
  renderTradeGrade();
}

function tgReset(){
  tradeState = {
    A: { manager: null, players: [], picks: [], lastDest: null },
    B: { manager: null, players: [], picks: [], lastDest: null },
    C: { manager: null, players: [], picks: [], lastDest: null },
  };
  tgActiveSides = ['A', 'B'];
  renderTradeGrade();
}

function tgDownloadImage(){
  const el = document.getElementById('tgWrapForExport');
  const btn = document.querySelector('.tg-download');
  if(btn){ btn.textContent = 'Generating...'; btn.disabled = true; }
  if(typeof html2canvas === 'undefined'){
    alert('Download feature requires an internet connection to load the image library.');
    if(btn){ btn.textContent = 'Download Graphic'; btn.disabled = false; }
    return;
  }
  html2canvas(el, {backgroundColor: '#111111'}).then(canvas => {
    const dataUrl = canvas.toDataURL('image/png');
    // Mobile webviews (including in-app browsers) frequently block or silently
    // swallow a programmatic <a download> click, especially once it's inside
    // an async .then() callback rather than directly inside the click handler.
    // Opening the image in a new tab is far more reliable cross-platform -
    // the user can then use their browser's native "save/share image" action
    // (press-and-hold on mobile, right-click on desktop).
    const win = window.open();
    if(win){
      win.document.write(`<html><head><title>Trade Grade</title></head><body style="margin:0;background:#111"><img src="${dataUrl}" style="width:100%;display:block;"><p style="color:#8e8e93;font-family:sans-serif;text-align:center;padding:12px;">Press and hold (or right-click) the image above to save it.</p></body></html>`);
    } else {
      // Popup blocked - fall back to the direct download attempt anyway
      const link = document.createElement('a');
      link.download = 'trade-grade.png';
      link.href = dataUrl;
      link.click();
    }
    if(btn){ btn.textContent = 'Download Graphic'; btn.disabled = false; }
  }).catch(err => {
    alert('Could not generate the image. Please try again.');
    if(btn){ btn.textContent = 'Download Graphic'; btn.disabled = false; }
  });
}

function render(){
  const hint = document.getElementById('hint');
  const filterRow = document.getElementById('filterRow');
  filterRow.style.display = (state.tab === 'rosters') ? 'flex' : 'none';
  const searchRow = document.getElementById('searchRow');
  searchRow.style.display = (state.tab === 'rosters') ? 'block' : 'none';
  if(state.tab === 'rosters') populateMgrFilter();
  if(state.tab === 'readme'){
    hint.style.display = 'none';
    renderReadme();
  } else if(state.tab === 'tradeGrade'){
    hint.style.display = 'none';
    renderTradeGrade();
  } else {
    hint.style.display = 'block';
    renderTable();
  }
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    state.sortCol = null;
    state.sortDir = 1;
    render();
  });
});

document.addEventListener('touchstart', (e) => {
  if(!e.target.closest('th')){
    document.getElementById('colTooltip').style.display = 'none';
    document.querySelectorAll('th.pressed').forEach(t => t.classList.remove('pressed'));
  }
}, { passive: true });
document.addEventListener('click', (e) => {
  if(!e.target.closest('th')){
    document.getElementById('colTooltip').style.display = 'none';
    document.querySelectorAll('th.pressed').forEach(t => t.classList.remove('pressed'));
  }
});

document.getElementById('seasonSelect').addEventListener('change', (e) => {
  state.season = e.target.value;
  state.sortCol = null;
  state.sortDir = 1;
  render();
});

document.getElementById('playerSearchInput').addEventListener('input', (e) => {
  state.playerSearch = e.target.value;
  renderTable();
});

render();
</script>
